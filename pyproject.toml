[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "dispatchbus"
version = "0.1.0a1"
description = "Dispatchbus Python project."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Kevin Rieck" },
]
license = "Apache-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kevin-rieck/dispatchbus"
Repository = "https://github.com/kevin-rieck/dispatchbus.git"
Issues = "https://github.com/kevin-rieck/dispatchbus/issues"

[project.scripts]
dispatchbus = "dispatchbus.__main__:main"

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.11,<0.12",
  "pyright>=1.1,<2",
  "rich>=15,<16",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/dispatchbus"]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.20,<1"]
