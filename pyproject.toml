[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "dispatchr"
version = "0.1.0"
description = "Dispatchr Python project."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Kevin Rieck" },
]
license = "Apache-2.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kevin-rieck/dispatchr"
Repository = "https://github.com/kevin-rieck/dispatchr.git"
Issues = "https://github.com/kevin-rieck/dispatchr/issues"

[project.scripts]
dispatchr = "dispatchr.__main__:main"

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.11.0",
  "pyright>=1.1.0",
  "rich>=15.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/dispatchr"]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.20.0"]
